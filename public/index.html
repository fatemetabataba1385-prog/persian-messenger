<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پیام‌رسان فارسی</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 95vh;
      max-height: 800px;
      background: #0f0f1a;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #2a2a4a;
    }

    .header {
      background: linear-gradient(90deg, #0088cc, #00a8e8);
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: bold;
    }

    .online-count {
      font-size: 13px;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
    }

    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      gap: 20px;
      color: #eee;
    }

    #login-screen h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    #login-screen p {
      font-size: 14px;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }

    #username-input {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      border: 2px solid #0088cc;
      border-radius: 25px;
      background: #1a1a2e;
      color: white;
      font-size: 16px;
      outline: none;
      text-align: center;
    }

    #join-btn {
      background: #0088cc;
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #join-btn:hover {
      background: #0077b3;
    }

    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: #0088cc;
      color: white;
      border-bottom-left-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: #252540;
      color: #eee;
      border-bottom-right-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 12px;
      padding: 4px 10px;
    }

    .username {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .message.own .username {
      color: #cceeff;
    }

    .message.other .username {
      color: #7dd3fc;
    }

    .time {
      font-size: 11px;
      opacity: 0.65;
      margin-top: 4px;
      text-align: left;
    }

    .message img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
      cursor: pointer;
    }

    .caption {
      margin-top: 6px;
      font-size: 14px;
    }

    .input-area {
      display: flex;
      padding: 10px 12px;
      border-top: 1px solid #2a2a4a;
      background: #151525;
      gap: 8px;
      align-items: center;
    }

    #message-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #333;
      border-radius: 22px;
      background: #1a1a2e;
      color: white;
      font-size: 15px;
      outline: none;
    }

    #message-input::placeholder {
      color: #666;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #252540;
      color: #0088cc;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #2a2a50;
    }

    #send-btn {
      background: #0088cc;
      color: white;
    }

    #send-btn:hover {
      background: #0077b3;
    }

    #file-input {
      display: none;
    }

    .preview-bar {
      display: none;
      padding: 8px 12px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      align-items: center;
      gap: 10px;
    }

    .preview-bar img {
      height: 50px;
      border-radius: 8px;
    }

    .preview-bar button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    /* اسکرول‌بار زیبا */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h1>💬 پیام‌رسان فارسی</h1>
      <div class="online-count" id="online-count">آنلاین: ۰</div>
    </div>

    <!-- صفحه ورود -->
    <div id="login-screen">
      <h2>خوش آمدید 👋</h2>
      <p>
        این یک پیام‌رسان گروهی ساده است.<br>
        نام خود را وارد کنید و وارد شوید.<br>
        می‌توانید متن، عکس و گیف بفرستید.
      </p>
      <input type="text" id="username-input" placeholder="نام شما..." maxlength="20" autocomplete="off">
      <button id="join-btn">ورود به چت</button>
    </div>

    <!-- صفحه چت -->
    <div id="chat-screen">
      <div id="messages"></div>

      <div class="preview-bar" id="preview-bar">
        <img id="preview-img" src="" alt="پیش‌نمایش">
        <button onclick="cancelImage()">حذف عکس</button>
      </div>

      <div class="input-area">
        <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="ارسال عکس">📷</button>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="message-input" placeholder="پیام بنویسید..." autocomplete="off">
        <button class="icon-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUsername = '';
    let selectedImage = null;

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const usernameInput = document.getElementById('username-input');
    const onlineCount = document.getElementById('online-count');
    const fileInput = document.getElementById('file-input');
    const previewBar = document.getElementById('preview-bar');
    const previewImg = document.getElementById('preview-img');

    // ورود با Enter
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinChat();
    });
    document.getElementById('join-btn').addEventListener('click', joinChat);

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function joinChat() {
      const name = usernameInput.value.trim();
      if (!name) {
        alert('لطفاً نام خود را وارد کنید');
        return;
      }
      myUsername = name;
      socket.emit('join', name);
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      messageInput.focus();
    }

    // انتخاب عکس
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        alert('حجم عکس نباید بیشتر از ۵ مگابایت باشد');
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        selectedImage = ev.target.result;
        previewImg.src = selectedImage;
        previewBar.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    });

    function cancelImage() {
      selectedImage = null;
      previewBar.style.display = 'none';
      fileInput.value = '';
    }

    function sendMessage() {
      const text = messageInput.value.trim();

      if (selectedImage) {
        socket.emit('image message', {
          username: myUsername,
          image: selectedImage,
          caption: text
        });
        cancelImage();
        messageInput.value = '';
        return;
      }

      if (!text) return;

      socket.emit('chat message', {
        username: myUsername,
        message: text
      });
      messageInput.value = '';
    }

    // دریافت پیام
    socket.on('chat message', (data) => {
      const isOwn = data.username === myUsername;
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;

      let content = `<div class="username">${escapeHtml(data.username)}</div>`;

      if (data.type === 'image') {
        content += `<img src="${data.image}" alt="عکس" onclick="window.open(this.src)">`;
        if (data.caption) {
          content += `<div class="caption">${escapeHtml(data.caption)}</div>`;
        }
      } else {
        content += `<div>${escapeHtml(data.message)}</div>`;
      }

      content += `<div class="time">${data.time}</div>`;
      div.innerHTML = content;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    socket.on('user joined', (data) => {
      updateOnline(data.online);
      addSystemMessage(`${data.username} وارد شد`);
    });

    socket.on('user left', (data) => {
      updateOnline(data.online);
      addSystemMessage(`${data.username} خارج شد`);
    });

    function updateOnline(list) {
      onlineCount.textContent = `آنلاین: ${list.length}`;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
